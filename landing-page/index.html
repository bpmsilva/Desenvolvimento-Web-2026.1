<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        * {
            /* Reseta as margens e o padding de todos os elementos */
            margin: 0;
            padding: 0;
        }

        div {
            /* Estiliza a barra de navegação */
            background-color: black;
            text-align: center;
        }

        span {
            /* Estiliza os itens da barra de navegação */
            display: inline-block;
            padding: 12px 20px;
            color: white;
            font-size: 20px;
        }

        span:hover {
            /* Adiciona um efeito de hover aos itens da barra de navegação */
            background-color: grey;
        }

        #main-img {
            /* Estiliza a imagem principal */
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div>
        <span>Quem somos</span>
        <span>Produtos</span>
        <span>Nossos trabalhos</span>
        <span>Feedback</span>
        <span>Contato</span>
    </div>
    <img id="main-img" src="./imgs/main-hb20.png">
</body>
</html>
