<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Código embutido no HTML. -->
    <script>
        console.log('Código embutido carregado com sucesso!');
    </script>

    <!-- Percebam o uso do defer. -->
    <script src="script-externo.js" defer></script>
</head>
<body>
    <h1>Explicação sobre como é feita a inclusão de scripts no HTML</h1>

    <!-- É possível incluir scripts antes da tag </body>. -->
</body>
</html>
